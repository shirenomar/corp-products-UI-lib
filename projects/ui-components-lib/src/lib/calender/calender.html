<!-- calender.html -->
<div dir="rtl" class="p-2">
  <!-- Tabs -->


  <div class="header-tabs">
    <button class="tab-btn" [class.active]="mode === 'gregorian'" (click)="mode='gregorian'">
      الميلادي
    </button>

    <button class="tab-btn" [class.active]="mode === 'hijri'" (click)="mode='hijri'">
      هجري
    </button>
  </div>

  @if(mode === 'gregorian') {
  <app-gregorian-calendar [model]="gregorianModel" (dateSelected)="onSelectGregorian($event)">
  </app-gregorian-calendar>
  }

  @if(mode === 'hijri') {
  <app-hijri-calendar [model]="hijriModel" (dateSelected)="onSelectHijri($event)">
  </app-hijri-calendar>
  }
</div>
