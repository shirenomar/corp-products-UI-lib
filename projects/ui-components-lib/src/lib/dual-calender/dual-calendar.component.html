<div class="calender-content"   #calendarContainer>
  @if(isDatePickerShow) {
    <stc-date-picker-switcher [variant]="'in'" [label]="label" id="dateId" (openCalender)="showCalender($event)"
    [control]="control" [formattedDate]='selectedDate' (manualCommit)="onManualDateInput($event)">
    </stc-date-picker-switcher>
  }

  <!-- calender.html -->
  <div (click)="$event.stopPropagation()" [dir]="currentLang() === 'ar' ? 'rtl' : 'ltr'" class="p-2 calendar-wrapper " [@slideDown]="isShown ? 'open' : 'closed'"  #calendarWrapper>
    <div class="header-tabs">
      <div class="header-label">{{'calender.calender_type' | translate}}</div>
      <div class="tabs">
        <button class="tab-button" [class.active]="mode === 'gregorian'"  type="button" (click)="  mode='gregorian'">
          {{'calender.gregorian' | translate}}
        </button>
        <button class="tab-button" [class.active]="mode === 'hijri'" type="button" (click)=" mode='hijri'">
          {{'calender.hijri' | translate}}
        </button>
      </div>
    </div>
    @if(mode === 'gregorian') {
    <app-gregorian-calendar [model]="gregorianModel" [language]="currentLang()"
      [disabledDays]="disabledDays" [disabledDates]="disabledDates" (dateSelected)="onSelectGregorian($event)">
    </app-gregorian-calendar>
    }

    @if(mode === 'hijri') {
    <app-hijri-calendar [model]="hijriModel" [language]="currentLang()"
      [disabledDays]="disabledDays" [disabledDates]="disabledDates" (dateSelected)="onSelectHijri($event)">
    </app-hijri-calendar>
    }
  </div>
</div>
