<p-drawer
  (onHide)="hideBottomSheet()"
  (onShow)="onShow.emit($event)"
  [(visible)]="show"
  [closable]="false"
  [ngClass]="{ show: show }"
  [position]="'bottom'"
  appendTo="body"
  >
  <ng-template #header>
    <div class="band"></div>
  </ng-template>
  @if (contentTemplate) {
    <ng-template #content>
      <ng-container *ngTemplateOutlet="contentTemplate"></ng-container>
    </ng-template>
  }
</p-drawer>
