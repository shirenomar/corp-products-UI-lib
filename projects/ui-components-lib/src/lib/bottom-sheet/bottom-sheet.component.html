<p-drawer
  (onHide)="hideBottomSheet()"
  (onShow)="onShow.emit($event)"
  [(visible)]="show"
  [closable]="false"
  [ngClass]="{ show: show }"
  [position]="'bottom'"
  appendTo="body"
  >
  <ng-template pTemplate="header">
    <div class="band"></div>
  </ng-template>
  <ng-template #dynamicContainer></ng-template>
</p-drawer>
