<p-button
  (click)="clickEmitter.emit()"
  [class]="class"
  [disabled]="disabled"
  [iconPos]="iconPos"
  [icon]="icon"
  [label]="title"
  [rounded]="rounded"
  [severity]="severity"
  [styleClass]="'border-[' + borderColor + '] rounded-none bg-[' + bgColor + '] min-w-['+ minWidth +'] text-[14px]'"
  [text]="text"
  [variant]="variant"

>
</p-button>
