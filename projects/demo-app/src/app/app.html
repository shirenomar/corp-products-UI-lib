<!-- Dynamic Form Demo -->
<section class="p-4 border rounded-md mt-4">
  <h2 class="text-lg font-semibold mb-4">Dynamic Form Demo</h2>
  <app-dynamic-form [dynamicFormData]="dynamicFormData" (selectButtonChange)="onDynamicSelectButtonChange($event)"
    (selectChange)="onDynamicSelectChange($event)" (switchChange)="onDynamicSwitchChange($event)"
    (autoCompleteSearch)="onDynamicAutoCompleteSearch($event)"
    (autoCompleteSelect)="onDynamicAutoCompleteSelect($event)"></app-dynamic-form>

  <div class="mt-4">
    <app-button [label]="'Submit Dynamic Form'" [severity]="'primary'" [raised]="true"
      (click)="onSubmitDynamicForm()"></app-button>
    <app-button class="ml-2" [label]="'Open Confirmation with Dynamic Form'" [severity]="'primary'" variant="outlined"
      (click)="openConfirmWithForm()"></app-button>
  </div>
  <pre class="mt-4 bg-gray-100 p-2 rounded">{{ dynamicFormGroup.value | json }}</pre>
</section>
