<!-- input component test input with float label and textarea -->
<form [formGroup]="form2">

  <stc-input [variant]="'in'" [contentType]="'text'" [label]="'Label'" [hideOptionalLabel]="true" [type]="'text'" [defaultColor]="'#DFE0E6'"
    [inputId]="'input-id'" [control]="inputControl">
  </stc-input>
  <stc-select [variant]="'in'" [inputId]="'select-id'"  [defaultColor]="'#DFE0E6'" [label]="'Select Item'" id="selectId" [control]="selectControl" [options]="selectItems"
    [multiple]="false" [optionLabel]="'name'" [showClear]="false">
  </stc-select>

  <stc-date-picker [variant]="'in'" [label]="'Select Date'" id="dateId" [control]="dateControl"
    [selectionMode]="'single'" [showIcon]="true">
  </stc-date-picker>
  <app-button [label]="'Submit'" [severity]="'primary'" [raised]="true"></app-button>
</form>
